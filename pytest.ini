[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = 
    compras
    dashboard
    inventario
    pagina
    produccion
    reports
    usuarios
    ventas
addopts = -v --tb=short
norecursedirs = .venv node_modules .git __pycache__