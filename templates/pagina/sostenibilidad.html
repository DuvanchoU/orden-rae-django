{% load static %}
{% load humanize %}
{% load custom_auth %}

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiénes Somos - ORDER RAE</title>
    <meta name="description" content="Conoce al equipo detrás de ORDER RAE: artesanos colombianos dedicados a crear muebles únicos desde 2015.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600,700,800&display=swap" rel="stylesheet" />
    
    <!-- Bootstrap + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Tu CSS -->
    <link rel="stylesheet" href="{% static 'css/estilos_web.css' %}?v=3.0">
    <link rel="stylesheet" href="{% static 'css/estilos_footer.css' %}?v=2.0">
    
    <!-- Estilos específicos -->
    <style>
        :root {
            --color-primario: #8B5E3C;
            --color-primario-dark: #6B462C;
            --color-secundario: #7A4B32;
            --color-acento: #ffd166;
            --color-exito: #06d6a0;
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
            --radius-lg: 24px;
            --transition-normal: 300ms ease;
        }
        [data-theme="dark"] {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
            --border-color: #3a3a5a;
        }
        body {
            background: var(--bg-secondary);
            font-family: 'Figtree', sans-serif;
            color: var(--text-primary);
            transition: background var(--transition-normal), color var(--transition-normal);
        }
        
        /* Hero Section */
        .about-hero {
            position: relative;
            height: 70vh;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(139,94,60,0.9) 0%, rgba(122,75,50,0.8) 100%),
                        url('{% static "img/taller_madera.jpg" %}') center/cover;
            color: white;
            text-align: center;
            padding: 2rem;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--color-acento);
            color: #333;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            margin-bottom: 1.5rem;
            animation: float 3s ease infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .hero-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; margin-bottom: 1rem; }
        .hero-subtitle { font-size: clamp(1rem, 2.5vw, 1.25rem); opacity: 0.95; max-width: 700px; margin: 0 auto 2rem; }
        
        /* Team Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        .team-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            text-align: center;
            transition: transform var(--transition-normal);
        }
        .team-card:hover { transform: translateY(-10px); }
        .team-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            margin: 1.5rem auto 1rem;
            border: 4px solid var(--color-acento);
            object-fit: cover;
        }
        .team-name { font-weight: 700; margin-bottom: 0.25rem; }
        .team-role { color: var(--color-primario); font-weight: 500; }
        
        /* Values Cards */
        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin: 3rem 0;
        }
        .value-card {
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: var(--radius-lg);
            text-align: center;
            border: 2px solid transparent;
            transition: all var(--transition-normal);
        }
        .value-card:hover {
            border-color: var(--color-primario);
            transform: translateY(-5px);
        }
        .value-icon {
            font-size: 2.5rem;
            color: var(--color-primario);
            margin-bottom: 1rem;
        }
        
        /* CTA Section */
        .cta-section {
            background: linear-gradient(135deg, var(--color-primario), var(--color-secundario));
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            border-radius: var(--radius-lg);
            margin: 4rem 0;
        }
        .btn-cta {
            background: var(--color-acento);
            color: #333;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform var(--transition-normal);
        }
        .btn-cta:hover { transform: translateY(-3px); }
        
        /* Dark Mode Toggle & WhatsApp */
        .theme-toggle {
            position: fixed; bottom: 2rem; left: 2rem;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--bg-primary); border: 2px solid var(--border-color);
            color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; z-index: 100;
        }
        .btn-flotante-whatsapp {
            position: fixed; bottom: 2rem; right: 2rem;
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; z-index: 100; text-decoration: none;
        }
        
        @media (max-width: 768px) {
            .team-grid, .values-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

<!-- ════════════════════════════════════════
    HEADER
════════════════════════════════════════ -->
{% include 'partials/header.html' %}

    <!-- Contenido Principal -->
    <main class="container main-with-fixed-header">
        
        <!-- Sección de métricas -->
        <section style="background: linear-gradient(135deg, #06d6a0 0%, #118ab2 100%); color: white; padding: 4rem 0; border-radius: var(--radius-lg); margin: 3rem 0;">
            <div class="container">
                <div class="text-center mb-5">
                    <h2 style="font-size: 2.5rem; font-weight: 700;">Nuestro Impacto Positivo</h2>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem;">
                    {% for m in metrics %}
                    <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 2rem; border-radius: var(--radius-lg); text-align: center; border: 1px solid rgba(255,255,255,0.2);" data-aos="zoom-in">
                        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">{{ m.icono }}</div>
                        <div style="font-size: 2rem; font-weight: 700;">{{ m.numero }}</div>
                        <div>{{ m.label }}</div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    {% include 'partials/footer.html' %}

    <!-- Botones Flotantes -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo oscuro">
        <i class="fas fa-moon"></i>
    </button>
    <a href="https://wa.me/573166712526" class="btn-flotante-whatsapp" target="_blank" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/header.js' %}"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inicializar AOS
        AOS.init({ duration: 800, once: true });
        
        // Dark Mode Toggle
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle?.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeToggle.querySelector('i').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        });
        
        // Aplicar tema guardado
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.querySelector('i').className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        
        // Toast simple
        window.showToast = function(msg, type='info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast-modern ${type}`;
            toast.style.cssText = `background:var(--bg-primary); border-left:4px solid var(--color-${type==='success'?'exito':'primario'}); border-radius:16px; padding:1rem 1.5rem; box-shadow:0 8px 25px rgba(0,0,0,0.15); display:flex; align-items:center; gap:0.75rem; min-width:320px; max-width:400px; animation:slideInRight 0.3s ease, fadeOut 0.3s ease 4.7s forwards;`;
            toast.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'info-circle'}"></i><div>${msg}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };
    </script>
</body>
</html>
